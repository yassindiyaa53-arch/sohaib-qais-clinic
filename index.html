<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عيادة الدكتور صهيب قيس</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #1f2937;
    }

    header {
      background: #ffffff;
      padding: 20px 30px;
      border-bottom: 1px solid #e5e7eb;
    }

    header h1 {
      font-size: 24px;
    }

    header p {
      color: #6b7280;
      margin-top: 5px;
    }

    main {
      padding: 30px;
      max-width: 1200px;
      margin: auto;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      border: 1px solid #e5e7eb;
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .card p {
      color: #6b7280;
    }
  </style>
</head>

<body>

  <header>
    <h1>عيادة الدكتور صهيب قيس</h1>
    <p>نظام إدارة العيادة</p>
  </header>

  <main>
    <div class="cards">

      <div class="card">
        <h2>👤 المرضى</h2>
        <p>إدارة بيانات المرضى وملفاتهم.</p>
      </div>

      <div class="card">
        <h2>📅 المواعيد</h2>
        <p>إدارة مواعيد المرضى.</p>
      </div>

      <div class="card">
        <h2>🦷 العلاجات</h2>
        <p>متابعة علاجات المرضى.</p>
      </div>

      <div class="card">
        <h2>💰 الحسابات</h2>
        <p>الفواتير والمدفوعات.</p>
      </div>

    </div>
  </main>

</body>
</html>
